---
# Create a Proxmox VM by cloning a cloud-init template.
# Variables come from the AWX survey and the "Proxmox API" credential.
- name: Create VM in Proxmox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    proxmox_api_defaults: &api
      api_host: "{{ proxmox_host }}"
      api_user: "{{ proxmox_user }}"
      api_token_id: "{{ proxmox_token_id }}"
      api_token_secret: "{{ proxmox_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs | default(false) | bool }}"

    # Survey defaults (overridden by the AWX survey)
    vm_name: test-vm01
    vm_node: pve
    vm_template: stratum-ubuntu-noble-template
    vm_storage: local-lvm
    vm_cores: 2
    vm_memory: 2048
    vm_disk_size: 60G
    vm_bridge: vmbr0
    vm_ip: dhcp            # or e.g. 192.168.1.50/24
    vm_gateway: "10.1.152.254"
    vm_user: ubuntu
    vm_ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINUZWsKDMMbE0mESlAhKsbOluEW+IgPCTHsyLZO5mS6K sandata-local"

  pre_tasks:
    # The default AWX execution environment does not ship proxmoxer.
    # Long term: build a custom EE with it baked in (see README).
    - name: Ensure proxmoxer is available
      ansible.builtin.pip:
        name: [proxmoxer, requests]
        extra_args: --user

  tasks:
    # The Proxmox API only returns VMs the token has permission to see
    - name: List VMs visible to the API token
      community.proxmox.proxmox_vm_info:
        <<: *api
      register: visible_vms

    - name: Fail clearly if the template is not visible
      ansible.builtin.assert:
        that: vm_template in (visible_vms.proxmox_vms | map(attribute='name') | list)
        fail_msg: >-
          Template '{{ vm_template }}' not visible to token
          {{ proxmox_user }}!{{ proxmox_token_id }}. Visible VMs:
          {{ visible_vms.proxmox_vms | map(attribute='name') | list }}.
          Empty list = token has no permissions (Privilege Separation).

    - name: Clone template
      community.proxmox.proxmox_kvm:
        <<: *api
        node: "{{ vm_node }}"
        clone: "{{ vm_template }}"
        name: "{{ vm_name }}"
        full: true
        storage: "{{ vm_storage }}"
        timeout: 600
      register: clone_result

    - name: Configure CPU, memory, network and cloud-init
      community.proxmox.proxmox_kvm:
        <<: *api
        node: "{{ vm_node }}"
        name: "{{ vm_name }}"
        update: true
        cores: "{{ vm_cores | int }}"
        memory: "{{ vm_memory | int }}"
        net:
          net0: "virtio,bridge={{ vm_bridge }}"
        ipconfig:
          ipconfig0: >-
            {{ 'ip=dhcp' if vm_ip == 'dhcp'
               else 'ip=' ~ vm_ip ~ (',gw=' ~ vm_gateway if vm_gateway else '') }}
        ciuser: "{{ vm_user }}"
        cipassword: "{{ vm_password | default(omit, true) }}"
        sshkeys: "{{ vm_ssh_key | default(omit, true) }}"
      no_log: "{{ vm_password | default('') | length > 0 }}"

    # Templates may boot from scsi0, virtio0, sata0... so read it from the VM config
    - name: Read cloned VM config
      community.proxmox.proxmox_vm_info:
        <<: *api
        node: "{{ vm_node }}"
        vmid: "{{ clone_result.vmid }}"
        config: current
      register: vm_info

    - name: Detect boot disk
      vars:
        cfg: "{{ vm_info.proxmox_vms[0].config }}"
        boot_order: "{{ (cfg.boot | default('')) | regex_findall('(?:scsi|virtio|sata|ide)\\d+') }}"
        all_disks: >-
          {{ cfg | dict2items
             | selectattr('key', 'match', '^(scsi|virtio|sata|ide)\d+$')
             | rejectattr('value', 'search', 'cloudinit|media=cdrom')
             | map(attribute='key') | list }}
      ansible.builtin.set_fact:
        boot_disk: "{{ vm_disk | default((boot_order | intersect(all_disks) + all_disks) | first) }}"

    - name: Resize boot disk
      community.proxmox.proxmox_disk:
        <<: *api
        vmid: "{{ clone_result.vmid }}"
        disk: "{{ boot_disk }}"
        size: "{{ vm_disk_size }}"
        state: resized

    - name: Start VM
      community.proxmox.proxmox_kvm:
        <<: *api
        node: "{{ vm_node }}"
        name: "{{ vm_name }}"
        state: started

    # Static IP: known from the survey. DHCP: ask the QEMU guest agent
    # (needs qemu-guest-agent installed in the template).
    - name: Use static IP
      ansible.builtin.set_fact:
        vm_ssh_host: "{{ vm_ip | split('/') | first }}"
      when: vm_ip != 'dhcp'

    - name: Get DHCP IP from guest agent
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ vm_node }}/qemu/{{ clone_result.vmid }}/agent/network-get-interfaces"
        headers:
          Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs | default(false) | bool }}"
      register: agent_net
      until: >-
        agent_net.status == 200 and
        (agent_net.json.data.result | map(attribute='ip-addresses', default=[]) | flatten
         | selectattr('ip-address-type', 'eq', 'ipv4')
         | rejectattr('ip-address', 'match', '^127\.') | list | length > 0)
      retries: 30
      delay: 10
      failed_when: false
      no_log: true
      when: vm_ip == 'dhcp'

    - name: Fail clearly if guest agent gave no IP
      ansible.builtin.assert:
        that: agent_net.status | default(0) == 200
        fail_msg: >-
          Could not get the VM's DHCP IP from the QEMU guest agent. Install
          qemu-guest-agent in the template, or use a static IP in the survey.
      when: vm_ip == 'dhcp'

    - name: Set DHCP IP
      ansible.builtin.set_fact:
        vm_ssh_host: >-
          {{ agent_net.json.data.result | map(attribute='ip-addresses', default=[]) | flatten
             | selectattr('ip-address-type', 'eq', 'ipv4')
             | rejectattr('ip-address', 'match', '^127\.')
             | map(attribute='ip-address') | first }}
      when: vm_ip == 'dhcp'

    - name: Wait for SSH to come online
      ansible.builtin.wait_for:
        host: "{{ vm_ssh_host }}"
        port: 22
        search_regex: OpenSSH
        delay: 10
        timeout: "{{ vm_ssh_timeout | default(600) | int }}"

    - name: Show result
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} (id {{ clone_result.vmid }}) created on {{ vm_node }}, SSH ready: ssh {{ vm_user }}@{{ vm_ssh_host }}"
