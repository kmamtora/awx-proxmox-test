# AWX > Administration > Credential Types > Add > "Input configuration"
fields:
  - id: proxmox_host
    type: string
    label: Proxmox Host (e.g. 192.168.1.10)
  - id: proxmox_user
    type: string
    label: API User (e.g. root@pam)
  - id: proxmox_token_id
    type: string
    label: API Token ID (e.g. awx)
  - id: proxmox_token_secret
    type: string
    label: API Token Secret
    secret: true
required:
  - proxmox_host
  - proxmox_user
  - proxmox_token_id
  - proxmox_token_secret
