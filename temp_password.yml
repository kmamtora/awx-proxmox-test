---
# Set a temporary password for a user on a VM over SSH.
# The user must change it at next login. Variables come from the AWX survey;
# SSH login comes from an AWX "Machine" credential.
- name: Prepare target VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Survey defaults (overridden by the AWX survey)
    target_host: ""          # VM IP or hostname, e.g. 10.1.152.201

  tasks:
    - name: Require a target host
      ansible.builtin.assert:
        that: target_host | length > 0
        fail_msg: "Set target_host to the VM's IP or hostname."

    - name: Add VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        groups: target_vm

- name: Set temporary password
  hosts: target_vm
  become: true
  gather_facts: false

  vars:
    # Survey defaults (overridden by the AWX survey)
    target_user: ""
    temp_password_length: 16
    # Days until the account locks if the password is never changed (0 = never)
    temp_password_expire_days: 0

  tasks:
    - name: Require a username
      ansible.builtin.assert:
        that: target_user is match('^[a-z_][a-z0-9_-]{0,31}$')
        fail_msg: "'{{ target_user }}' is not a valid Linux username."

    - name: Check the user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
        fail_key: false

    - name: Fail clearly if the user is missing
      ansible.builtin.assert:
        that: getent_passwd[target_user] is not none
        fail_msg: "User '{{ target_user }}' does not exist on {{ inventory_hostname }}."

    # Avoid look-alike characters (0/O, 1/l/I) so it is easy to read out
    - name: Generate temporary password
      ansible.builtin.set_fact:
        temp_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    length=temp_password_length | int,
                    chars=['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789']) }}
      no_log: true

    # chpasswd hashes on the VM itself, so no passlib is needed on the AWX side
    - name: Set password
      ansible.builtin.command:
        cmd: chpasswd
        stdin: "{{ target_user }}:{{ temp_password }}"
      no_log: true
      changed_when: true

    - name: Force password change at next login
      ansible.builtin.command:
        cmd: "chage -d 0 {{ target_user }}"
      changed_when: true

    - name: Lock account if not changed in time
      ansible.builtin.command:
        cmd: "chage -I {{ temp_password_expire_days | int }} -M 99999 {{ target_user }}"
      when: temp_password_expire_days | int > 0
      changed_when: true

    # This is the only place the password appears; it is in this job's output
    - name: Show temporary password
      ansible.builtin.debug:
        msg:
          - "Host:     {{ inventory_hostname }}"
          - "User:     {{ target_user }}"
          - "Password: {{ temp_password }}"
          - "The user must change it at first login."
