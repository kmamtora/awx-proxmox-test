---
# Create a user on an existing VM over SSH.
# Variables come from the AWX survey; SSH login comes from an AWX "Machine" credential.
- name: Prepare target VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Survey defaults (overridden by the AWX survey)
    target_host: ""          # VM IP or hostname, e.g. 10.1.152.201

  tasks:
    - name: Require a target host
      ansible.builtin.assert:
        that: target_host | length > 0
        fail_msg: "Set target_host to the VM's IP or hostname."

    - name: Add VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        groups: new_vm

- name: Create user on VM
  hosts: new_vm
  become: true
  gather_facts: false

  vars:
    # Survey defaults (overridden by the AWX survey)
    new_user: ""
    new_user_password: ""    # optional; leave blank for key-only login
    new_user_ssh_key: ""     # optional public key
    new_user_sudo: true
    new_user_shell: /bin/bash
    # AWX multiple-choice answers can arrive as a list, e.g. ["true"]
    give_sudo: "{{ ([new_user_sudo] | flatten | first | default(true)) | bool }}"

  tasks:
    - name: Require a username
      ansible.builtin.assert:
        that: new_user is match('^[a-z_][a-z0-9_-]{0,31}$')
        fail_msg: "'{{ new_user }}' is not a valid Linux username."

    # Kept separate from the password step so real errors stay visible in the log
    - name: Create user
      ansible.builtin.user:
        name: "{{ new_user }}"
        shell: "{{ new_user_shell }}"
        create_home: true
        groups: "{{ 'sudo' if give_sudo else omit }}"
        append: true

    # chpasswd hashes on the VM itself, so no passlib is needed on the AWX side
    - name: Set password
      ansible.builtin.command:
        cmd: chpasswd
        stdin: "{{ new_user }}:{{ new_user_password }}"
      when: new_user_password | length > 0
      no_log: true
      changed_when: true

    - name: Add SSH public key
      ansible.posix.authorized_key:
        user: "{{ new_user }}"
        key: "{{ new_user_ssh_key }}"
        exclusive: false
      when: new_user_ssh_key | length > 0

    - name: Allow passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ new_user }}"
        content: "{{ new_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s
      when:
        - give_sudo | bool
        - new_user_password | length == 0

    - name: Show result
      ansible.builtin.debug:
        msg: "User {{ new_user }} created on {{ inventory_hostname }} (sudo: {{ give_sudo }})"
